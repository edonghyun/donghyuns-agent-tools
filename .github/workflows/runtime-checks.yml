name: runtime-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: QA runtime regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/qa-operator/scripts -p 'test_*.py' -v

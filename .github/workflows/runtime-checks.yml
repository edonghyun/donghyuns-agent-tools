name: runtime-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: QA runtime regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/qa-operator/scripts -p 'test_*.py' -v

  wireflow-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: wireflow model tests
        run: node --test plugins/wireflow/scripts/test/*.test.mjs
      - name: wireflow example builds
        run: |
          node plugins/wireflow/scripts/wireflow.mjs check plugins/wireflow/examples/class-booking.flow.json --with retry-to-detail
          node plugins/wireflow/scripts/wireflow.mjs build plugins/wireflow/examples/class-booking.flow.json /tmp/class-booking.html
          node plugins/wireflow/scripts/wireflow.mjs build plugins/wireflow/examples/consulting-request.flow.json /tmp/consulting-request.html
